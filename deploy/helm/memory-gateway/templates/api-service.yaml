apiVersion: v1
kind: Service
metadata:
  name: {{ include "memory-gateway.fullname" . }}
  labels:
    {{- include "memory-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "memory-gateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
