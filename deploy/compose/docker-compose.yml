# Development stack.
#
# Every backing service the product will ever need is here from task 01, even though most
# stay unused until later tasks — so no future task has to touch this file to bring one up.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d
#   curl localhost:8000/readyz

name: memory-gateway

x-postgres-env: &postgres-env
  POSTGRES_USER: gateway
  POSTGRES_PASSWORD: gateway
  POSTGRES_DB: gateway

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      ENVIRONMENT: dev
      LOG_LEVEL: INFO
      RUN_MIGRATIONS: "1"
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: memory-gateway
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      ENCRYPTION_MASTER_KEY: ZGV2LW9ubHktbWFzdGVyLWtleS0zMi1ieXRlcyEhISE=
      JWT_SIGNING_KEY: dev-only-jwt-signing-key-change-me-please
      PUBLIC_BASE_URL: http://localhost:8000
      # Argon2id at production cost adds ~100 ms to every login; the dev stack does not
      # need that, and the defaults in .env.example are what a deployment gets.
      PASSWORD_MEMORY_COST_KIB: "16384"
      PASSWORD_TIME_COST: "2"
      # The image ships the built SPA at /srv/web, but in development the `web` service
      # below serves it from source with hot reload. Blanking this keeps one answer to
      # "which UI am I looking at".
      WEB_DIST_DIR: ""
      # The Vite dev server is a different origin, so the login request is cross-origin
      # and needs credentials allowed. Not used in production, where the API serves the UI.
      CORS_ORIGINS: '["http://localhost:5173"]'
      # Read only by `python -m app.cli seed`; the service itself never looks at them.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "8000:8000"
    volumes:
      # Hot reload: the source is mounted over the image's copy. The virtualenv lives at
      # /srv/.venv and is deliberately outside these mounts.
      - ../../app:/srv/app
      - ../../migrations:/srv/migrations
      - ../../alembic.ini:/srv/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment: *postgres-env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has no curl or wget; Qdrant ships its own readiness command.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/memory-gateway
        mc anonymous set none local/memory-gateway
    restart: "no"

  web:
    image: node:22-alpine
    working_dir: /srv/web
    # `npm ci` on every start keeps the container's packages in step with the lockfile
    # without a rebuild; it is a no-op when nothing changed.
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      # Vite proxies /api here, so the browser only ever sees one origin in development.
      VITE_API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ../../web:/srv/web
      # node_modules stays in a container-local volume: the host's copy is built for the
      # host's platform, and on Windows or macOS bind-mounting it is both wrong and slow.
      - web-node-modules:/srv/web/node_modules
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
  web-node-modules:
