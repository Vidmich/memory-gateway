{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "memory-gateway.fullname" . }}
  labels:
    {{- include "memory-gateway.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "memory-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
# Only the API is scraped, because only the API serves a port. The numbers that matter
# about the workers — queue depth above all — are read out of Redis at scrape time by
# whichever replica is asked, so they are already here and say the same thing on every one.
{{- end }}
