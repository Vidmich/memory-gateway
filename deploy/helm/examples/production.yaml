# A complete production override. Copy it, change the four hostnames, create the Secret,
# and this is a deployable release.
#
# What is *not* here is as deliberate as what is: no database URL, no master key, no
# provider credential. Those live in the Secret named at the bottom, which this repository
# never sees.

image:
  repository: ghcr.io/memory-gateway/memory-gateway
  # Pinned by digest rather than tag. A tag is mutable, and "the same version on every
  # pod" is otherwise a claim about a registry rather than a fact about the cluster.
  digest: ""
  tag: "0.1.0"

config:
  environment: prod
  logLevel: INFO
  publicBaseUrl: https://gateway.example.com
  qdrantUrl: http://qdrant.data.svc.cluster.local:6333
  s3Endpoint: https://s3.eu-west-1.amazonaws.com
  s3Bucket: memory-gateway-prod
  s3Region: eu-west-1

  embedding:
    provider: openai
    model: text-embedding-3-small
    dimension: 1536
    baseUrl: https://api.openai.com/v1

  upstream:
    privateAddresses: block
    # The one self-hosted model this deployment allows a tenant to point at. Named
    # explicitly rather than opened by CIDR: an allowlist that covers a range covers
    # everything else that ever moves into it.
    allowedHosts:
      - vllm.models.svc.cluster.local
    routingDeadlineSeconds: 120

  extra:
    # Retention and rate-limit ceilings are platform settings in the database since task
    # 17 and are set on the Platform screen, not here. What stays here is the bootstrap a
    # fresh database starts from.
    STORAGE_QUOTA_BYTES: "107374182400"
    WORKER_MAX_JOBS: "12"

api:
  replicaCount: 3
  drainSeconds: 15
  # 15 + 120, with 45 seconds of margin. The chart refuses to render if this is short.
  terminationGracePeriodSeconds: 180
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetRequestsPerSecond: 40
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 2Gi
  antiAffinity: hard

worker:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 12
    queueDepthPerPod: 20

heavyWorker:
  enabled: true
  replicaCount: 2

ingress:
  enabled: true
  className: nginx
  host: gateway.example.com
  tls:
    enabled: true
    secretName: gateway-tls
  maxBodySize: 50m

tracing:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
  # Five per cent of ordinary traffic. Errors are kept in full by the collector's tail
  # sampler, which is the only place that can know a request failed.
  sampleRatio: 0.05

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

prometheusRule:
  enabled: true
  labels:
    release: kube-prometheus-stack

secrets:
  # kubectl create secret generic memory-gateway \
  #   --from-literal=DATABASE_URL='postgresql+asyncpg://...' \
  #   --from-literal=REDIS_URL='redis://...' \
  #   --from-literal=S3_ACCESS_KEY_ID=... \
  #   --from-literal=S3_SECRET_ACCESS_KEY=... \
  #   --from-literal=ENCRYPTION_MASTER_KEY="$(openssl rand -base64 32)" \
  #   --from-literal=JWT_SIGNING_KEY="$(openssl rand -hex 32)" \
  #   --from-literal=EMBEDDING_API_KEY=sk-...
  #
  # Or point an ExternalSecret at the same name and let the operator write it.
  existingSecret: memory-gateway
