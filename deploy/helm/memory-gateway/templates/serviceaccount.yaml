{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "memory-gateway.serviceAccountName" . }}
  labels:
    {{- include "memory-gateway.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application calls no Kubernetes API, so the token is not mounted. On a cluster whose
# metadata endpoint is reachable this also removes the most valuable thing an SSRF would
# find if the guard in app/core/ssrf.py were ever bypassed.
automountServiceAccountToken: false
{{- end }}
