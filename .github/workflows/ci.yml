name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv sync --all-groups

      - name: ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

  test:
    name: tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@localhost:5432/gateway
      REDIS_URL: redis://localhost:6379/0
      # Database-backed tests skip on a laptop with the stack down. In CI they must run,
      # so an unapplied migration fails the build instead of quietly disappearing.
      REQUIRE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv sync --all-groups

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: eslint
        run: npm run lint

      - name: tsc
        run: npm run typecheck

      - name: vitest
        run: npm run test

      - name: production build
        run: npm run build

  api-client:
    name: generated API client is current
    runs-on: ubuntu-latest

    # Dev-safe values: nothing is connected to, the app is only built far enough to
    # produce its OpenAPI schema.
    env:
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@localhost:5432/gateway
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: memory-gateway
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      ENCRYPTION_MASTER_KEY: ZGV2LW9ubHktbWFzdGVyLWtleS0zMi1ieXRlcyEhISE=
      JWT_SIGNING_KEY: ci-only-jwt-signing-key-at-least-32-chars
      PUBLIC_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: uv sync --all-groups

      - run: npm ci
        working-directory: web

      # Regenerates and fails if the committed client differs from the live schema — the
      # frontend's types are only worth anything if they are the server's.
      - name: openapi drift
        run: make openapi-check

  docker:
    name: image builds & scans clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # `load: true` rather than discarding it: the scan below needs the image in the
      # local daemon, and building it twice would double the slowest job here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: memory-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Task 18: fail on high severity. Not on every severity — a base image always has a
      # handful of unfixable lows, and a gate that is always red is a gate somebody
      # disables. `ignore-unfixed` for the same reason: a CVE with no patch available is
      # not something this pipeline can act on, and it would block every build until the
      # distribution catches up.
      - name: trivy (image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: memory-gateway:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      # A separate, non-blocking pass over the source tree, so a vulnerable dependency is
      # visible in the log even when it is not yet fixable.
      - name: trivy (dependencies, informational)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL

  chart:
    name: helm chart renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv sync --all-groups

      # The chart tests skip without `helm` on a laptop and must not skip here: they are
      # what turns "the grace period must exceed the routing deadline" from a comment into
      # a failed render.
      - name: chart rendering and lint
        run: uv run pytest tests/test_deploy_assets.py -q

      # Rendered manifests validated against the cluster's own schemas, which catches the
      # kind of mistake a template test cannot — a misspelled field name that is perfectly
      # good YAML.
      - name: kubeconform
        env:
          KUBECONFORM: https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
        run: |
          curl -fsSL -o kubeconform.tar.gz "$KUBECONFORM"
          tar xzf kubeconform.tar.gz kubeconform
          for values in deploy/helm/examples/*.yaml; do
            echo "== $values"
            helm template release deploy/helm/memory-gateway -f "$values" > rendered.yaml
            ./kubeconform -strict -summary -ignore-missing-schemas rendered.yaml
          done
