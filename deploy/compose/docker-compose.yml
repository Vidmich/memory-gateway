# Development stack.
#
# Every backing service the product will ever need is here from task 01, even though most
# stay unused until later tasks — so no future task has to touch this file to bring one up.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d
#   curl localhost:8000/readyz

name: memory-gateway

# Shared by `api` and `worker`. They are the same image running the same code against the
# same backing services; the only differences are the command and who runs migrations, so
# anything else diverging between them would be a bug rather than a configuration.
x-app-env: &app-env
  ENVIRONMENT: dev
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: memory-gateway
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  ENCRYPTION_MASTER_KEY: ZGV2LW9ubHktbWFzdGVyLWtleS0zMi1ieXRlcyEhISE=
  JWT_SIGNING_KEY: dev-only-jwt-signing-key-change-me-please
  PUBLIC_BASE_URL: http://localhost:8000
  # Argon2id at production cost adds ~100 ms to every login; the dev stack does not
  # need that, and the defaults in .env.example are what a deployment gets.
  PASSWORD_MEMORY_COST_KIB: "16384"
  PASSWORD_TIME_COST: "2"
  # The local lexical embedder: no key, no network, no semantics. Enough to demonstrate
  # the whole ingest-and-search path on a laptop, and refused outright when
  # ENVIRONMENT=prod so it cannot be deployed by accident.
  EMBEDDING_PROVIDER: hash
  EMBEDDING_MODEL: hash-bow
  EMBEDDING_DIMENSION: "256"
  # The image ships the built SPA at /srv/web, but in development the `web` service
  # below serves it from source with hot reload. Blanking this keeps one answer to
  # "which UI am I looking at".
  WEB_DIST_DIR: ""
  # The Vite dev server is a different origin, so the login request is cross-origin
  # and needs credentials allowed. Not used in production, where the API serves the UI.
  CORS_ORIGINS: '["http://localhost:5173"]'
  # Invitation links have to open the UI, which in development is Vite rather than
  # the API. Without this an invitee lands on a JSON 404.
  APP_BASE_URL: http://localhost:5173
  # Read only by `python -m app.cli seed`; the service itself never looks at them.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}

x-postgres-env: &postgres-env
  POSTGRES_USER: gateway
  POSTGRES_PASSWORD: gateway
  POSTGRES_DB: gateway

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    volumes:
      # Hot reload: the source is mounted over the image's copy. The virtualenv lives at
      # /srv/.venv and is deliberately outside these mounts.
      - ../../app:/srv/app
      - ../../migrations:/srv/migrations
      - ../../alembic.ini:/srv/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # The interpreter that is already here. The image carries no curl on purpose
      # (see the Dockerfile): a tool that fetches URLs is the last thing an image whose
      # threat model is about fetching URLs needs to ship.
      test:
        ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # The ingestion worker. Same image, same environment, different command — SPEC 15
  # makes the application one stateless artefact, and a second image would be a second
  # thing to keep at the same version.
  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["arq", "app.workers.main.WorkerSettings"]
    environment:
      <<: *app-env
      # Migrations are the API's job; two containers racing `alembic upgrade` is a good
      # way to corrupt a schema.
      RUN_MIGRATIONS: "0"
    volumes:
      - ../../app:/srv/app
    depends_on: &worker-deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # The same worker reading the other queue. PDFs and Office documents are enqueued
  # there (see `app/services/jobs.queue_for`), so a folder of notes dropped alongside a
  # 300-page manual does not sit behind it. Fewer concurrent jobs on purpose: here
  # concurrency multiplies a parser's memory rather than an HTTP client's.
  #
  # Deleting this service is a supported configuration — those jobs then wait for
  # somebody to start one, which is a visible backlog rather than a silent loss.
  heavy-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["arq", "app.workers.main.HeavyWorkerSettings"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    volumes:
      - ../../app:/srv/app
    depends_on: *worker-deps
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment: *postgres-env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has no curl or wget; Qdrant ships its own readiness command.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/memory-gateway
        mc anonymous set none local/memory-gateway
    restart: "no"

  web:
    image: node:22-alpine
    working_dir: /srv/web
    # `npm ci` on every start keeps the container's packages in step with the lockfile
    # without a rebuild; it is a no-op when nothing changed.
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      # Vite proxies /api here, so the browser only ever sees one origin in development.
      VITE_API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ../../web:/srv/web
      # node_modules stays in a container-local volume: the host's copy is built for the
      # host's platform, and on Windows or macOS bind-mounting it is both wrong and slow.
      - web-node-modules:/srv/web/node_modules
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
  web-node-modules:
