{{- include "memory-gateway.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memory-gateway.fullname" . }}-api
  labels:
    {{- include "memory-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer pods than are running now: the new pod has to be ready before an old
      # one is asked to leave, or the deploy itself is the outage it was meant to avoid.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "memory-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        # Rolls the pods when configuration changes. Without it a ConfigMap edit is a
        # change that takes effect at the next unrelated deploy, which is the worst
        # possible time to discover it.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "memory-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "memory-gateway.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Long enough to drain and then to finish the longest request this pod is still
      # allowed to be making. _helpers.tpl refuses to render if it is not.
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- with (include "memory-gateway.affinity" (dict "root" . "values" .Values.api "component" "api")) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "memory-gateway.volumes" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "memory-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # No RUN_MIGRATIONS here, ever. Migrations are the pre-upgrade Job's; several
          # replicas racing `alembic upgrade` is a good way to corrupt a schema.
          args:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            # Uvicorn's own graceful shutdown is unbounded on purpose: the kubelet's
            # grace period is the deadline, and a second, shorter one here would truncate
            # exactly the streams this whole arrangement exists to protect.
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            {{- include "memory-gateway.envFrom" . | nindent 12 }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "memory-gateway.volumeMounts" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
